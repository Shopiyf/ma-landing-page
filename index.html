<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Ordre Moodigital — Stratégie & Incarnation</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Oswald:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Canela', 'Playfair Display', 'serif'], 
                        display: ['Manuka', 'Oswald', 'sans-serif'],
                    },
                    colors: {
                        earth: "#6B3F24",      // Brun Terre / Cognac - Socle
                        forest: "#1F3A2E",     // Vert Forêt - Sagesse
                        lilac: "#D8D1DA",      // Lilas / Gris Lavande - Intuition
                        amber: "#E07A2F",      // Orange Brûlé - Action / Seuil
                        cream: "#F4F1EC",      // Blanc Cassé - Respiration
                        metal: "#B6B6B6",      // Inox - Détail
                        black: "#111111",      // Structure
                    },
                    backgroundImage: {
                        'noise': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.8%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.07%22/%3E%3C/svg%3E')",
                        'checker': "linear-gradient(45deg, #1a1a1a 25%, transparent 25%), linear-gradient(-45deg, #1a1a1a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1a1a1a 75%), linear-gradient(-45deg, transparent 75%, #1a1a1a 75%)",
                    },
                    letterSpacing: {
                        'tightest': '-0.04em',
                    }
                },
            },
        }
    </script>
    
    <style>
        /* === DÉCLARATION DES POLICES LOCALES === */
        /* Si les fichiers ne sont pas présents, les fallbacks (Playfair/Oswald) prendront le relais */
        
        @font-face {
            font-family: 'Manuka';
            src: url('./1382df51f3297328e7355d0ecd34b0d1.woff2') format('woff2'),
                 url('./1382df51f3297328e7355d0ecd34b0d1.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'Canela';
            src: url('./4a24899e94d8236f671c1090cd9e068c.woff2') format('woff2'),
                 url('./4a24899e94d8236f671c1090cd9e068c.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        /* === CONFIGURATION GLOBALE === */

        :root {
            --background: #111111;
            --foreground: #F4F1EC;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Règle H1/H2 : Canela, tracking serré, autorité */
        h1, h2, h3, h4 {
            font-family: 'Canela', 'Playfair Display', serif; 
            letter-spacing: -0.03em; /* Tracking -2 to -4 equivalent */
            line-height: 1.1;
        }

        /* Règle Manuka : Accent, signature */
        .font-manifesto {
            font-family: 'Manuka', 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Texture Overlay (Grain) */
        .texture-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.6;
        }

        /* Sélection de texte Ambre */
        ::selection {
            background-color: #E07A2F; /* Amber */
            color: #F4F1EC;
        }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/clsx@2.0.0/dist/clsx.min.js"></script>
    <script src="https://unpkg.com/tailwind-merge@2.0.0/dist/bundle-mjs.js"></script>
</head>
<body>
    <div id="root"></div>
    <div class="texture-overlay"></div>

    <script type="text/babel">
        // --- UTILS & SETUP ---
        const { useState, useEffect, useRef, useMemo, useCallback, memo } = React;
        const { motion, useScroll, useTransform, AnimatePresence, useReducedMotion } = window.Motion;
        
        function cn(...inputs) {
            return window.clsx ? window.clsx(inputs) : inputs.filter(Boolean).join(' ');
        }

        // --- CUSTOM ICONS (Symbolique: Étoile à 8 branches) ---
        
        const Star8 = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className} xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z" />
            </svg>
        );

        const MenuIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="square" strokeLinejoin="miter" className={className}><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="18" y2="18"/></svg>
        );

        const XIcon = ({ className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="square" strokeLinejoin="miter" className={className}><path d="M18 6 6 18"/><path d="m6 6 18 12"/></svg>
        );

        // --- UI COMPONENTS ---

        // 1. CTA BUTTON (CHARTE: Orange Brûlé, Inter Semi-bold, Rectangulaire)
        const Button = ({ children, variant = "primary", className, ...props }) => {
            const baseStyle = "inline-flex items-center justify-center px-8 py-4 text-sm font-semibold tracking-wide transition-all duration-300 border font-sans cursor-pointer uppercase rounded-sm"; // Changed from rounded-full to rounded-sm (sharp)
            const variants = {
                primary: "bg-amber text-cream border-amber hover:bg-earth hover:border-earth hover:text-white",
                outline: "bg-transparent text-cream border-cream/30 hover:border-amber hover:text-amber",
                ghost: "bg-transparent text-lilac hover:text-amber border-transparent hover:bg-white/5"
            };
            
            return (
                <button className={cn(baseStyle, variants[variant], className)} {...props}>
                    {children}
                </button>
            );
        };

        // 2. SECTION HEADER
        const SectionHeader = ({ surtitle, title, align = "center", light = false }) => (
            <div className={cn("mb-20 space-y-6", align === "center" ? "text-center" : "text-left")}>
                <div className={cn("flex items-center gap-3", align === "center" ? "justify-center" : "justify-start")}>
                     <Star8 className="w-3 h-3 text-amber" />
                     <span className="font-manifesto text-amber text-sm tracking-[0.2em] uppercase">{surtitle}</span>
                     <Star8 className="w-3 h-3 text-amber" />
                </div>
                <h2 className={cn("text-5xl md:text-6xl lg:text-7xl font-serif tracking-tightest", light ? "text-forest" : "text-cream")}>{title}</h2>
                <div className={cn("h-px w-32 bg-metal/40 mt-8", align === "center" ? "mx-auto" : "")}></div>
            </div>
        );

        // 3. REVEAL ANIMATION
        const Reveal = ({ children, delay = 0 }) => (
            <motion.div
                initial={{ opacity: 0, y: 30 }}
                whileInView={{ opacity: 1, y: 0 }}
                viewport={{ once: true, margin: "-50px" }}
                transition={{ duration: 0.9, delay, ease: [0.22, 1, 0.36, 1] }} // Custom easing for "Authority"
            >
                {children}
            </motion.div>
        );

        // --- PAGE SECTIONS ---

        // NAV (SHARP & MINIMAL)
        const Navigation = () => {
            const [menuState, setMenuState] = useState(false);
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const menuItems = [
                { name: 'Manifeste', href: '#manifeste' },
                { name: 'L\'Ordre', href: '#piliers' },
                { name: 'Partner', href: '#partner' },
                { name: 'Journal', href: '#' },
            ];

            return (
                <header>
                    <nav className="fixed z-50 w-full pt-0">
                        <div 
                            className={cn(
                                'w-full px-6 md:px-12 transition-all duration-500 border-b relative z-50',
                                isScrolled 
                                    ? 'bg-black/95 backdrop-blur-md border-white/10 py-4' 
                                    : 'bg-transparent border-transparent py-8'
                            )}
                        >
                            <div className="flex items-center justify-between max-w-7xl mx-auto">
                                {/* Logo */}
                                <a href="/" className="flex items-center space-x-3 group">
                                    <Star8 className="w-5 h-5 text-amber transition-transform duration-500 group-hover:rotate-45" />
                                    <span className="font-serif text-2xl tracking-tight text-cream">MOODIGITAL</span>
                                </a>

                                {/* Desktop Links - Sharp & Clean */}
                                <div className="hidden lg:flex items-center gap-12">
                                    <ul className="flex gap-10 text-xs font-manifesto tracking-[0.15em] uppercase">
                                        {menuItems.map((item) => (
                                            <li key={item.name}>
                                                <a href={item.href} className="text-lilac hover:text-amber transition-colors duration-300 relative after:content-[''] after:absolute after:-bottom-2 after:left-0 after:w-0 after:h-px after:bg-amber hover:after:w-full after:transition-all after:duration-300">
                                                    {item.name}
                                                </a>
                                            </li>
                                        ))}
                                    </ul>
                                    <Button variant="outline" className="px-6 py-2 text-xs h-auto border-white/20 hover:border-amber">
                                        Candidater
                                    </Button>
                                </div>

                                {/* Mobile Toggle */}
                                <button onClick={() => setMenuState(!menuState)} className="lg:hidden text-cream hover:text-amber">
                                    {menuState ? <XIcon /> : <MenuIcon />}
                                </button>
                            </div>
                        </div>

                        {/* Mobile Menu Overlay */}
                        <AnimatePresence>
                            {menuState && (
                                <motion.div 
                                    initial={{ opacity: 0, height: 0 }}
                                    animate={{ opacity: 1, height: "100vh" }}
                                    exit={{ opacity: 0, height: 0 }}
                                    className="fixed inset-0 bg-earth z-40 flex items-center justify-center lg:hidden"
                                >
                                    <ul className="flex flex-col items-center gap-8 text-center">
                                        {menuItems.map((item) => (
                                            <li key={item.name}>
                                                <a href={item.href} onClick={() => setMenuState(false)} className="font-serif text-4xl text-cream hover:text-amber hover:italic transition-all">
                                                    {item.name}
                                                </a>
                                            </li>
                                        ))}
                                        <div className="mt-8">
                                            <Button onClick={() => setMenuState(false)}>Entrer dans l'Ordre</Button>
                                        </div>
                                    </ul>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </nav>
                </header>
            );
        };

        // HERO (EARTH BASE)
        const Hero = () => {
            return (
                <section className="relative min-h-screen flex items-center justify-center overflow-hidden bg-earth">
                    {/* Background Texture & Gradient */}
                    <div className="absolute inset-0 bg-gradient-to-b from-black/60 via-earth/80 to-black z-10"></div>
                    {/* Image Placeholder with grayscale overlay */}
                    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?q=80&w=2574&auto=format&fit=crop')] bg-cover bg-center opacity-20 mix-blend-multiply filter grayscale contrast-125"></div>
                    
                    <div className="relative z-20 text-center max-w-6xl px-6 flex flex-col items-center pt-20">
                        <Reveal>
                            <div className="mb-8 inline-flex items-center gap-4 border-b border-amber/50 pb-2">
                                <span className="text-xs font-manifesto tracking-[0.25em] text-amber uppercase">Message Officiel</span>
                            </div>
                        </Reveal>

                        <Reveal delay={0.2}>
                            <h1 className="text-7xl md:text-9xl text-cream font-serif leading-[0.85] tracking-tightest mb-8">
                                L'ORDRE <br/>
                                <span className="font-light italic opacity-80 text-6xl md:text-8xl">Moodigital</span>
                            </h1>
                        </Reveal>

                        <Reveal delay={0.4}>
                            <div className="h-px w-full max-w-[200px] bg-metal/30 my-8"></div>
                            <p className="text-lg md:text-xl text-lilac font-sans font-light leading-relaxed max-w-2xl mx-auto">
                                Une Maison de stratégie et d’incarnation business pour les entrepreneures souveraines.
                                <br/><br/>
                                <span className="text-cream font-medium">Ni agence. Ni coaching. Un Ordre.</span>
                            </p>
                        </Reveal>

                        <Reveal delay={0.6}>
                            <div className="flex flex-col md:flex-row gap-6 mt-16 w-full md:w-auto">
                                <Button>Entrer dans l'Ordre</Button>
                                <Button variant="outline">Lire le manifeste</Button>
                            </div>
                        </Reveal>
                    </div>

                    {/* Bottom Fade */}
                    <div className="absolute bottom-0 w-full h-40 bg-gradient-to-t from-black to-transparent z-20"></div>
                </section>
            );
        };

        // MANIFESTO (BLACK BLOCK)
        const Manifesto = () => {
            return (
                <section id="manifeste" className="py-32 bg-black relative">
                     {/* Damier Pattern (Punctual) */}
                     <div className="absolute top-0 right-0 w-32 h-32 opacity-10 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMCIgaGVpZ2h0PSIyMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmZmZmIiBzdHJva2Utd2lkdGg9IjAuNSI+PHBhdGggZD0iTTAgMGgyMHYyMEgwVjB6Ii8+PC9zdmc+')]"></div>

                    <div className="max-w-4xl mx-auto px-6">
                        <div className="border-l-2 border-amber pl-8 md:pl-12 py-2">
                            <Reveal>
                                <h3 className="text-4xl md:text-5xl font-serif text-cream leading-[1.1] mb-10 tracking-tightest">
                                    "Moodigital évolue. <br/>
                                    Pas pour devenir plus gros. <br/>
                                    <span className="text-amber italic">Mais pour devenir plus juste.</span>"
                                </h3>
                            </Reveal>
                            
                            <Reveal delay={0.2}>
                                <div className="space-y-8 text-lilac text-lg md:text-xl font-light leading-[1.6] font-sans">
                                    <p>
                                        Ce que je fais aujourd’hui, c’est accompagner des femmes à reprendre leur place, à incarner leur business, et à déployer sans se trahir.
                                    </p>
                                    <p className="text-cream font-medium">
                                        Alors Moodigital devient un Ordre. Un cadre.
                                    </p>
                                    <p>
                                        Un espace de discernement, de stratégie et de transformation incarnée. Il n’y a rien à rejoindre. Rien à consommer. Seulement des portes, selon ton moment.
                                    </p>
                                </div>
                            </Reveal>
                        </div>
                    </div>
                </section>
            );
        };

        // THE DOORS (FOREST BLOCK)
        const DoorCard = ({ number, title, subtitle, description, delay }) => (
            <Reveal delay={delay}>
                <div className="group relative border border-white/10 bg-black/20 p-10 h-full hover:border-amber transition-all duration-500 flex flex-col">
                    <div className="absolute top-6 right-6 opacity-30 group-hover:opacity-100 transition-opacity text-amber">
                        <Star8 className="w-5 h-5" />
                    </div>
                    
                    <span className="font-manifesto text-6xl text-forest/40 group-hover:text-amber/20 transition-colors mb-6 block">{number}</span>
                    
                    <h3 className="text-3xl font-serif text-cream mb-2 tracking-tight">{title}</h3>
                    <p className="font-manifesto text-xs tracking-[0.2em] text-amber uppercase mb-8">{subtitle}</p>
                    
                    <div className="h-px w-full bg-white/10 mb-8 group-hover:bg-amber/50 transition-colors"></div>
                    
                    <p className="text-lilac/80 font-sans font-light leading-relaxed mb-8 flex-grow">
                        {description}
                    </p>

                    <span className="text-xs uppercase tracking-widest text-white/40 group-hover:text-amber transition-colors flex items-center gap-2">
                        Explorer <span className="text-lg">→</span>
                    </span>
                </div>
            </Reveal>
        );

        const TheDoors = () => {
            return (
                <section id="piliers" className="py-32 bg-forest relative overflow-hidden">
                    <div className="absolute inset-0 bg-noise opacity-10 mix-blend-overlay"></div>
                    
                    <div className="relative z-10 max-w-7xl mx-auto px-6">
                        <SectionHeader 
                            surtitle="L'Écosystème" 
                            title="Trois Portes. Trois Passages." 
                        />

                        <div className="grid md:grid-cols-3 gap-0 lg:gap-8">
                            <DoorCard 
                                number="01"
                                title="Origin"
                                subtitle="S'aligner & Incarner"
                                description="Pour celles qui sentent qu’un réalignement profond est nécessaire. Reprendre le pouvoir. Créer depuis ta vérité."
                                delay={0}
                            />
                            <DoorCard 
                                number="02"
                                title="Partner"
                                subtitle="Structurer & Déléguer"
                                description="Ton bras droit stratégique. On remplace le flou par un pilotage clair. Pour les entrepreneures prêtes à bâtir."
                                delay={0.2}
                            />
                            <DoorCard 
                                number="03"
                                title="Savoir"
                                subtitle="Autonomie & Transmission"
                                description="Formations, carnets business et programmes courts pour entrer dans l'Ordre à ton rythme."
                                delay={0.4}
                            />
                        </div>
                    </div>
                </section>
            );
        };

        // PARTNER (EARTH BLOCK - SHARP GRID)
        const PartnerRow = ({ title, target, result, delay }) => (
            <Reveal delay={delay}>
                <div className="border-t border-white/10 py-12 group hover:bg-black/10 transition-colors">
                    <div className="grid md:grid-cols-12 gap-8 items-baseline px-4">
                        <div className="md:col-span-3">
                            <h4 className="text-3xl font-serif text-cream group-hover:text-amber transition-colors tracking-tight">{title}</h4>
                        </div>
                        <div className="md:col-span-4">
                            <p className="text-[10px] font-manifesto text-lilac/40 mb-3 tracking-[0.2em] uppercase">Pour qui</p>
                            <p className="text-lilac font-sans font-light leading-relaxed">{target}</p>
                        </div>
                        <div className="md:col-span-4">
                            <p className="text-[10px] font-manifesto text-lilac/40 mb-3 tracking-[0.2em] uppercase">Résultat</p>
                            <p className="text-cream font-sans font-light leading-relaxed">{result}</p>
                        </div>
                        <div className="md:col-span-1 flex justify-end">
                             <Star8 className="w-4 h-4 text-white/10 group-hover:text-amber transition-colors" />
                        </div>
                    </div>
                </div>
            </Reveal>
        );

        const PartnerDetails = () => {
            return (
                <section id="partner" className="py-32 bg-earth text-cream relative">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="grid lg:grid-cols-2 gap-16 mb-24">
                            <div>
                                <div className="inline-flex items-center gap-2 mb-6 text-amber">
                                    <Star8 className="w-4 h-4" />
                                    <span className="font-manifesto text-xs tracking-[0.2em] uppercase">Le Bras Droit</span>
                                </div>
                                <h2 className="text-6xl md:text-7xl font-serif tracking-tightest mb-8">Mood Partner</h2>
                                <p className="text-lg text-lilac font-sans font-light max-w-md leading-relaxed">
                                    Ici, on ne vend pas du temps. On vend de la vision, de l'arbitrage et de la structure.
                                    Un pacte sur la durée.
                                </p>
                            </div>
                            <div className="bg-black/30 p-10 border border-white/5 backdrop-blur-sm self-end">
                                <h5 className="font-manifesto text-amber mb-4 tracking-widest text-sm uppercase">Règle d'or</h5>
                                <p className="italic text-cream font-serif text-2xl leading-snug">
                                    "La posture précède toujours la stratégie. Ce cadre est là pour te protéger."
                                </p>
                            </div>
                        </div>

                        <div className="border-b border-white/10 mb-20">
                            <PartnerRow 
                                title="Essential"
                                target="Solopreneures lancées. Business stable mais désorganisé."
                                result="Moins de charge mentale. Plus de clarté. Un business qui avance."
                                delay={0}
                            />
                            <PartnerRow 
                                title="Growth"
                                target="Entrepreneures en croissance. Premières équipes."
                                result="Croissance maîtrisée. Organisation solide. Énergie préservée."
                                delay={0.1}
                            />
                            <PartnerRow 
                                title="Expansion"
                                target="Marques établies. CA solide. Besoin de pilotage global."
                                result="Sérénité. Expansion alignée. Liberté de temps."
                                delay={0.2}
                            />
                        </div>

                        <div className="flex justify-center">
                            <Button className="w-full md:w-auto min-w-[300px]">Candidater pour Partner</Button>
                        </div>
                    </div>
                </section>
            );
        };

        // FOOTER (SOLID, NO ROUNDING)
        const Footer = () => {
            const currentYear = new Date().getFullYear();

            return (
                <footer className="relative bg-black pt-24 pb-12 overflow-hidden border-t border-white/10">
                    {/* The Phrase-Sceau */}
                    <div className="absolute top-0 left-0 w-full overflow-hidden opacity-5 py-4 border-b border-white/10">
                        <div className="whitespace-nowrap font-manifesto text-8xl text-transparent stroke-text uppercase tracking-widest">
                            Tout ce qui est transmis est destiné à être incarné — 
                        </div>
                    </div>

                    <div className="max-w-7xl mx-auto px-6 relative z-10 mt-12">
                        <div className="grid md:grid-cols-4 gap-12 lg:gap-20 mb-20">
                            <div className="md:col-span-2 space-y-8">
