<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Ordre Moodigital — Stratégie & Incarnation</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Playfair Display pour l'Autorité (remplace Canela), Oswald pour l'Audace (remplace Manuka), Inter pour le corps -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Oswald:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        display: ['Oswald', 'sans-serif'],
                    },
                    colors: {
                        earth: "#6B3F24",     // Brun Terre
                        forest: "#1F3A2E",    // Vert Forêt
                        lilac: "#D8D1DA",     // Lilas / Gris Lavande
                        amber: "#E07A2F",     // Orange Brûlé (Action)
                        cream: "#F4F1EC",     // Blanc Cassé
                        metal: "#B6B6B6",     // Inox
                        black: "#111111",
                    },
                    backgroundImage: {
                        'noise': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.05%22/%3E%3C/svg%3E')",
                        'checker': "linear-gradient(45deg, #1a1a1a 25%, transparent 25%), linear-gradient(-45deg, #1a1a1a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #1a1a1a 75%), linear-gradient(-45deg, transparent 75%, #1a1a1a 75%)",
                    },
                    backgroundSize: {
                        'checker': '20px 20px',
                    }
                },
            },
        }
    </script>
    
    <style>
        /* Global Styles for "L'Ordre" Vibe */
        :root {
            --background: #111111;
            --foreground: #F4F1EC;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            overflow-x: hidden;
        }

        /* Typography overrides for specific vibes */
        h1, h2, h3, h4 {
            font-family: 'Playfair Display', serif;
            letter-spacing: -0.02em;
        }

        .font-manifesto {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Utility for the grain texture overlay */
        .texture-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        }
    </style>

    <!-- React & Framer Motion & Utils -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/clsx@2.0.0/dist/clsx.min.js"></script>
    <script src="https://unpkg.com/tailwind-merge@2.0.0/dist/bundle-mjs.js"></script>
</head>
<body>
    <div id="root"></div>
    <div class="texture-overlay"></div>

    <script type="text/babel">
        // --- UTILS & SETUP ---
        const { useState, useEffect, useRef, useMemo, useCallback, memo } = React;
        const { motion, useScroll, useTransform, AnimatePresence } = window.Motion;
        
        function cn(...inputs) {
            return window.clsx ? window.clsx(inputs) : inputs.filter(Boolean).join(' ');
        }

        // --- CUSTOM ICONS (Native SVG Components to avoid 'Element type invalid' errors) ---
        
        const Star8 = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className} xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z" />
            </svg>
        );

        const MoonIcon = ({ size = 24, strokeWidth = 2, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        );

        const SettingsIcon = ({ size = 24, strokeWidth = 2, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
        );

        const BookOpenIcon = ({ size = 24, strokeWidth = 2, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}>
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
        );

        // --- UI COMPONENTS ---

        // 1. CTA BUTTON (L'Ambre - Le Seuil)
        const Button = ({ children, variant = "primary", className, ...props }) => {
            const baseStyle = "inline-flex items-center justify-center px-8 py-3 text-sm font-medium transition-all duration-300 border font-sans tracking-wide cursor-pointer";
            const variants = {
                primary: "bg-amber text-cream border-amber hover:bg-earth hover:border-earth",
                outline: "bg-transparent text-cream border-cream/20 hover:border-amber hover:text-amber",
                ghost: "bg-transparent text-cream/60 hover:text-cream border-transparent"
            };
            
            return (
                <button className={cn(baseStyle, variants[variant], className)} {...props}>
                    {children}
                </button>
            );
        };

        // 2. SECTION HEADER
        const SectionHeader = ({ surtitle, title, align = "center" }) => (
            <div className={cn("mb-16 space-y-4", align === "center" ? "text-center" : "text-left")}>
                <span className="font-manifesto text-amber text-sm tracking-widest">{surtitle}</span>
                <h2 className="text-4xl md:text-5xl lg:text-6xl text-cream font-serif">{title}</h2>
                <div className={cn("h-px w-24 bg-metal/30 mt-6", align === "center" ? "mx-auto" : "")}></div>
            </div>
        );

        // 3. REVEAL ANIMATION WRAPPER
        const Reveal = ({ children, delay = 0 }) => (
            <motion.div
                initial={{ opacity: 0, y: 20 }}
                whileInView={{ opacity: 1, y: 0 }}
                viewport={{ once: true }}
                transition={{ duration: 0.8, delay, ease: "easeOut" }}
            >
                {children}
            </motion.div>
        );

        // --- PAGE SECTIONS ---

        // HEADER / NAV
        const Navigation = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            
            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={cn(
                    "fixed top-0 w-full z-50 transition-all duration-500 border-b",
                    isScrolled ? "bg-black/90 backdrop-blur-md border-white/5 py-4" : "bg-transparent border-transparent py-6"
                )}>
                    <div className="max-w-7xl mx-auto px-6 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <Star8 className="w-5 h-5 text-amber" />
                            <span className="font-serif text-xl tracking-wide text-cream">MOODIGITAL</span>
                        </div>
                        <div className="hidden md:flex gap-8 text-sm font-manifesto tracking-widest text-cream/70">
                            <a href="#manifeste" className="hover:text-amber transition-colors">Manifeste</a>
                            <a href="#piliers" className="hover:text-amber transition-colors">Les Portes</a>
                            <a href="#partner" className="hover:text-amber transition-colors">Partner</a>
                        </div>
                        <Button variant="outline" className="text-xs px-6 py-2">
                            Appel d'orientation
                        </Button>
                    </div>
                </nav>
            );
        };

        // HERO SECTION
        const Hero = () => {
            return (
                <section className="relative min-h-screen flex items-center justify-center overflow-hidden bg-earth">
                    {/* Background Texture & Gradient */}
                    <div className="absolute inset-0 bg-gradient-to-b from-black/80 via-earth/90 to-black z-10"></div>
                    <div className="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop')] bg-cover bg-center opacity-30 grayscale mix-blend-overlay"></div>
                    
                    {/* Content */}
                    <div className="relative z-20 text-center max-w-5xl px-6 space-y-8 mt-20">
                        <Reveal>
                            <div className="inline-flex items-center gap-3 border border-white/10 px-4 py-1 rounded-full bg-white/5 backdrop-blur-sm mb-6">
                                <span className="w-2 h-2 rounded-full bg-amber animate-pulse"></span>
                                <span className="text-xs font-manifesto tracking-widest text-cream/80">Message Officiel — Lancement</span>
                            </div>
                        </Reveal>

                        <Reveal delay={0.2}>
                            <h1 className="text-6xl md:text-8xl lg:text-9xl text-cream font-serif leading-[0.9]">
                                L'Ordre <br/>
                                <span className="italic text-cream/90">Moodigital</span>
                            </h1>
                        </Reveal>

                        <Reveal delay={0.4}>
                            <p className="text-lg md:text-xl text-lilac/80 max-w-2xl mx-auto font-light leading-relaxed mt-6">
                                Une Maison de stratégie et d’incarnation business pour les entrepreneures souveraines.
                                <br/>
                                <span className="text-amber">Ni agence. Ni coaching. Un Ordre.</span>
                            </p>
                        </Reveal>

                        <Reveal delay={0.6}>
                            <div className="flex flex-col md:flex-row gap-6 justify-center mt-12">
                                <Button>Entrer dans l'Ordre</Button>
                                <Button variant="ghost">Lire le manifeste</Button>
                            </div>
                        </Reveal>
                    </div>

                    {/* Bottom Gradient Fade */}
                    <div className="absolute bottom-0 w-full h-32 bg-gradient-to-t from-black to-transparent z-20"></div>
                </section>
            );
        };

        // MANIFESTO SECTION
        const Manifesto = () => {
            return (
                <section id="manifeste" className="py-32 bg-black relative">
                    <div className="max-w-4xl mx-auto px-6">
                        <div className="border-l border-amber/30 pl-8 md:pl-16 py-4">
                            <Reveal>
                                <h3 className="text-3xl md:text-4xl font-serif text-cream leading-snug mb-8">
                                    "Moodigital évolue. <br/>
                                    Pas pour devenir plus gros. <br/>
                                    <span className="text-amber italic">Mais pour devenir plus juste.</span>"
                                </h3>
                            </Reveal>
                            
                            <Reveal delay={0.2}>
                                <div className="space-y-6 text-lilac/90 text-lg font-light leading-relaxed">
                                    <p>
                                        Depuis plusieurs mois, je sens que ce que je fais ne peut plus être résumé à "communication", "stratégie" ou "accompagnement business".
                                    </p>
                                    <p>
                                        Ce que je fais aujourd’hui, c’est accompagner des femmes à reprendre leur place, à incarner leur business, et à déployer sans se trahir.
                                    </p>
                                    <p className="text-cream font-medium">
                                        Alors Moodigital devient un Ordre. Un cadre.
                                    </p>
                                    <p>
                                        Un espace de discernement, de stratégie et de transformation incarnée. Il n’y a rien à rejoindre. Rien à consommer. Seulement des portes, selon ton moment.
                                    </p>
                                </div>
                            </Reveal>
                        </div>

                        {/* Checkerboard Pattern Strip */}
                        <div className="w-full h-12 mt-20 opacity-20" 
                             style={{backgroundImage: 'linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%)', backgroundSize: '20px 20px'}}>
                        </div>
                    </div>
                </section>
            );
        };

        // THE 3 DOORS (OFFERS)
        const DoorCard = ({ title, subtitle, description, icon: Icon, delay }) => (
            <Reveal delay={delay}>
                <div className="group relative border border-white/10 bg-white/5 p-8 md:p-12 h-full hover:border-amber/50 transition-all duration-500 hover:bg-white/[0.07]">
                    <div className="absolute top-0 right-0 p-4 opacity-20 group-hover:opacity-100 transition-opacity text-amber">
                        <Star8 className="w-6 h-6" />
                    </div>
                    <div className="mb-8 text-amber">
                        <Icon size={32} strokeWidth={1} />
                    </div>
                    <h3 className="text-2xl font-serif text-cream mb-2">{title}</h3>
                    <p className="font-manifesto text-xs tracking-widest text-lilac/60 mb-6">{subtitle}</p>
                    <div className="h-px w-12 bg-white/20 mb-6 group-hover:w-full transition-all duration-700 ease-out"></div>
                    <p className="text-lilac/80 font-light leading-relaxed">
                        {description}
                    </p>
                </div>
            </Reveal>
        );

        const TheDoors = () => {
            return (
                <section id="piliers" className="py-32 bg-forest relative overflow-hidden">
                    {/* Background elements */}
                    <div className="absolute top-0 left-0 w-full h-full bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-black/40 via-forest to-black/80"></div>
                    
                    <div className="relative z-10 max-w-7xl mx-auto px-6">
                        <SectionHeader 
                            surtitle="L'Écosystème" 
                            title="Trois Portes. Trois Passages." 
                        />

                        <div className="grid md:grid-cols-3 gap-6 lg:gap-8">
                            <DoorCard 
                                title="ORIGIN"
                                subtitle="S'ALIGNER & INCARNER"
                                description="Pour celles qui sentent qu’un réalignement profond est nécessaire. Reprendre le pouvoir. Créer depuis ta vérité. Un espace de guidance stratégique et intuitive."
                                icon={MoonIcon}
                                delay={0}
                            />
                            <DoorCard 
                                title="PARTNER"
                                subtitle="STRUCTURER & DÉLÉGUER"
                                description="Ton bras droit stratégique. Pour celles qui veulent structurer et déléguer avec justesse. On remplace toutes les anciennes prestations floues par un pilotage clair."
                                icon={SettingsIcon}
                                delay={0.2}
                            />
                            <DoorCard 
                                title="TRANSMISSIONS"
                                subtitle="AUTONOMIE & SAVOIR"
                                description="Pour avancer en autonomie, à son rythme. Formations, carnets business et programmes courts pour entrer dans l'univers Mood."
                                icon={BookOpenIcon}
                                delay={0.4}
                            />
                        </div>
                    </div>
                </section>
            );
        };

        // PARTNER DEEP DIVE
        const PartnerRow = ({ title, target, result, delay }) => (
            <Reveal delay={delay}>
                <div className="border-b border-white/10 py-10 hover:bg-white/[0.02] transition-colors group px-4">
                    <div className="grid md:grid-cols-12 gap-6 items-start">
                        <div className="md:col-span-4">
                            <h4 className="text-2xl font-serif text-cream group-hover:text-amber transition-colors">{title}</h4>
                        </div>
                        <div className="md:col-span-4">
                            <p className="text-xs font-manifesto text-lilac/50 mb-2 tracking-widest">POUR QUI</p>
                            <p className="text-lilac/90 font-light">{target}</p>
                        </div>
                        <div className="md:col-span-4">
                            <p className="text-xs font-manifesto text-lilac/50 mb-2 tracking-widest">RÉSULTAT</p>
                            <p className="text-lilac/90 font-light">{result}</p>
                        </div>
                    </div>
                </div>
            </Reveal>
        );

        const PartnerDetails = () => {
            return (
                <section id="partner" className="py-32 bg-earth text-cream">
                    <div className="max-w-6xl mx-auto px-6">
                        <div className="grid lg:grid-cols-2 gap-16 mb-20">
                            <div>
                                <SectionHeader align="left" surtitle="Le Bras Droit" title="Mood Partner" />
                                <p className="text-lg text-lilac/90 font-light max-w-md">
                                    Ici, on ne vend pas du temps. On vend de la vision, de l'arbitrage et de la structure.
                                    Un pacte sur la durée pour celles qui sont prêtes.
                                </p>
                            </div>
                            <div className="bg-black/20 p-8 border border-white/5 backdrop-blur-sm self-end">
                                <h5 className="font-manifesto text-amber mb-4">Règle d'or</h5>
                                <p className="italic text-cream/80 font-serif text-xl">
                                    "La posture précède toujours la stratégie. Ce cadre est là pour te protéger."
                                </p>
                            </div>
                        </div>

                        <div className="border-t border-white/10">
                            <PartnerRow 
                                title="ESSENTIAL"
                                target="Solopreneures lancées. Business stable mais désorganisé."
                                result="Moins de charge mentale. Plus de clarté. Un business qui avance."
                                delay={0}
                            />
                            <PartnerRow 
                                title="GROWTH"
                                target="Entrepreneures en croissance. Premières équipes."
                                result="Croissance maîtrisée. Organisation solide. Énergie préservée."
                                delay={0.1}
                            />
                            <PartnerRow 
                                title="EXPANSION"
                                target="Marques établies. CA solide. Besoin de pilotage global."
                                result="Sérénité. Expansion alignée. Liberté de temps."
                                delay={0.2}
                            />
                        </div>

                        <div className="mt-20 text-center">
                            <p className="mb-8 font-light text-lilac">Engagement minimum requis. Pas de vente à l'heure.</p>
                            <Button>Candidater pour Partner</Button>
                        </div>
                    </div>
                </section>
            );
        };

        // FOOTER
        const Footer = () => {
            return (
                <footer className="bg-black pt-24 pb-12 border-t border-white/10">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-12 mb-20">
                            <div className="lg:col-span-2">
                                <div className="flex items-center gap-2 mb-8">
                                    <Star8 className="w-6 h-6 text-amber" />
                                    <span className="font-serif text-2xl text-cream">MOODIGITAL</span>
                                </div>
                                <p className="text-lilac/60 font-light max-w-sm mb-8">
                                    Une Maison de stratégie et d’incarnation business.
                                    <br/>
                                    <br/>
                                    Ici, on ne consomme pas du savoir. On incarne sa vérité.
                                </p>
                            </div>
                            
                            <div>
                                <h4 className="font-manifesto text-cream text-sm tracking-widest mb-6">L'Ordre</h4>
                                <ul className="space-y-4 text-lilac/60 font-light text-sm">
                                    <li><a href="#" className="hover:text-amber transition-colors">Manifeste</a></li>
                                    <li><a href="#" className="hover:text-amber transition-colors">Origin</a></li>
                                    <li><a href="#" className="hover:text-amber transition-colors">Partner</a></li>
                                    <li><a href="#" className="hover:text-amber transition-colors">Transmissions</a></li>
                                </ul>
                            </div>

                            <div>
                                <h4 className="font-manifesto text-cream text-sm tracking-widest mb-6">Légal</h4>
                                <ul className="space-y-4 text-lilac/60 font-light text-sm">
                                    <li><a href="#" className="hover:text-amber transition-colors">Mentions légales</a></li>
                                    <li><a href="#" className="hover:text-amber transition-colors">CGV</a></li>
                                    <li><a href="#" className="hover:text-amber transition-colors">Politique de confidentialité</a></li>
                                </ul>
                            </div>
                        </div>

                        <div className="border-t border-white/5 pt-8 flex flex-col md:flex-row justify-between items-center gap-4">
                            <p className="text-xs text-lilac/30 uppercase tracking-widest">© 2024 L'Ordre Moodigital. Tous droits réservés.</p>
                            <div className="text-xs text-lilac/30 font-serif italic">
                                "Tout ce qui est transmis ici est destiné à être incarné."
                            </div>
                        </div>
                    </div>
                </footer>
            );
        };

        // --- MAIN APP ---
        function App() {
            return (
                <div className="bg-black text-cream min-h-screen selection:bg-amber selection:text-black">
                    <Navigation />
                    <Hero />
                    <Manifesto />
                    <TheDoors />
                    <PartnerDetails />
                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
