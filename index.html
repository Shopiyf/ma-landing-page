<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Ordre Moodigital — Stratégie & Incarnation</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/clsx@2.0.0/dist/clsx.min.js"></script>
    <script src="https://unpkg.com/tailwind-merge@2.0.0/dist/bundle-mjs.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Canela', 'Playfair Display', 'serif'],
                        display: ['Manuka', 'Oswald', 'sans-serif'],
                    },
                    colors: {
                        earth: "#6B3F24",      // Brun Terre / Cognac (Socle)
                        forest: "#1F3A2E",     // Vert Forêt (Sagesse)
                        lilac: "#D8D1DA",      // Lilas (Intuition)
                        amber: "#E07A2F",      // Orange Brûlé (Seuil/CTA)
                        cream: "#F4F1EC",      // Blanc Cassé (Respiration)
                        metal: "#B6B6B6",      // Inox (Détail)
                        black: "#111111",      // Structure
                    },
                    backgroundImage: {
                        'noise': "url('data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noiseFilter%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noiseFilter)%22 opacity=%220.05%22/%3E%3C/svg%3E')",
                    },
                    borderRadius: {
                        // Suppression des arrondis mous. On garde juste un micro-arrondi pour éviter l'effet "coupant"
                        DEFAULT: '2px',
                        'sm': '2px',
                        'md': '4px',
                        'lg': '4px',
                        'full': '9999px', // Uniquement pour les badges ronds
                    }
                },
            },
        }
    </script>
    
    <style>
        /* === DÉCLARATION DES POLICES LOCALES === */
        
        /* MANUKA (Accent / Signature) */
        @font-face {
            font-family: 'Manuka';
            src: url('./1382df51f3297328e7355d0ecd34b0d1.woff2') format('woff2'),
                 url('./1382df51f3297328e7355d0ecd34b0d1.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        /* CANELA (Titres / Autorité) */
        @font-face {
            font-family: 'Canela';
            src: url('./4a24899e94d8236f671c1090cd9e068c.woff2') format('woff2'),
                 url('./4a24899e94d8236f671c1090cd9e068c.woff') format('woff');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        /* === RÈGLES GLOBALES === */
        :root {
            --background: #111111;
            --foreground: #F4F1EC;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            overflow-x: hidden;
            line-height: 1.6; /* Interlignage généreux pour la respiration */
        }

        /* TITRES (Canela) : Autorité calme, tracking serré (-2 à -4) */
        h1, h2, h3, h4 {
            font-family: 'Canela', 'Playfair Display', serif; 
            letter-spacing: -0.03em; 
            line-height: 1.15;
        }

        /* ACCENTS (Manuka) : Signature, max 2 lignes */
        .font-manifesto {
            font-family: 'Manuka', 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        html { scroll-behavior: smooth; }

        /* Texture de fond subtile (remplace le bois si non dispo) */
        .texture-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.07;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='1'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="texture-overlay"></div>

    <script type="text/babel">
        // --- UTILS ---
        const { useState, useEffect } = React;
        const { motion, useReducedMotion } = window.Motion;
        
        function cn(...inputs) {
            return window.clsx ? window.clsx(inputs) : inputs.filter(Boolean).join(' ');
        }

        // --- ICONS (Étoile 8 branches = Symbole Clé) ---
        const Star8 = ({ className }) => (
            <svg viewBox="0 0 24 24" fill="currentColor" className={className} xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5L12 0Z" />
            </svg>
        );

        const MenuIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className={className}><line x1="3" x2="21" y1="12" y2="12"/><line x1="3" x2="21" y1="6" y2="6"/><line x1="3" x2="21" y1="18" y2="18"/></svg>;
        const XIcon = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" className={className}><path d="M18 6 6 18"/><path d="m6 6 18 12"/></svg>;
        const ArrowRight = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>;

        // --- COMPOSANTS UI STRICTS ---

        // 1. CTA BUTTON (Orange Brûlé, Texte Blanc, Inter Semi-Bold, Rectangulaire)
        const Button = ({ children, variant = "primary", className, ...props }) => {
            const baseStyle = "inline-flex items-center justify-center px-8 py-4 text-sm font-semibold transition-all duration-300 border font-sans tracking-wide cursor-pointer rounded-sm";
            const variants = {
                primary: "bg-amber text-cream border-amber hover:bg-earth hover:border-earth hover:text-white",
                outline: "bg-transparent text-cream border-cream/30 hover:border-amber hover:text-amber",
                ghost: "bg-transparent text-cream/60 hover:text-cream border-transparent"
            };
            
            return (
                <button className={cn(baseStyle, variants[variant], className)} {...props}>
                    {children}
                </button>
            );
        };

        // 2. SECTION HEADER (Alignements nets, séparateur Métal)
        const SectionHeader = ({ surtitle, title, align = "center" }) => (
            <div className={cn("mb-20 space-y-4", align === "center" ? "text-center" : "text-left")}>
                {/* Manuka pour l'accent */}
                <span className="font-manifesto text-amber text-xl md:text-2xl block">{surtitle}</span>
                {/* Canela pour le titre */}
                <h2 className="text-4xl md:text-6xl lg:text-7xl text-cream font-serif">{title}</h2>
                {/* Séparateur Inox/Métal */}
                <div className={cn("h-px w-24 bg-metal/40 mt-8", align === "center" ? "mx-auto" : "")}></div>
            </div>
        );

        // 3. REVEAL (Animation sobre)
        const Reveal = ({ children, delay = 0 }) => (
            <motion.div
                initial={{ opacity: 0, y: 20 }}
                whileInView={{ opacity: 1, y: 0 }}
                viewport={{ once: true }}
                transition={{ duration: 0.8, delay, ease: "easeOut" }}
            >
                {children}
            </motion.div>
        );

        // --- NAVIGATION ---
        const Navigation = () => {
            const [menuState, setMenuState] = useState(false);
            const [isScrolled, setIsScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <header>
                    <nav className="fixed z-50 w-full px-0 pt-0">
                        <div className={cn(
                            'w-full transition-all duration-500 border-b',
                            isScrolled 
                                ? 'bg-black/95 border-white/5 py-4 backdrop-blur-sm' 
                                : 'bg-transparent border-transparent py-6 lg:py-8'
                        )}>
                            <div className="max-w-7xl mx-auto px-6 flex items-center justify-between">
                                {/* Logo */}
                                <a href="/" className="flex items-center gap-3 group">
                                    <Star8 className="w-6 h-6 text-amber group-hover:rotate-45 transition-transform duration-500" />
                                    <span className="font-serif text-xl tracking-wide text-cream">MOODIGITAL</span>
                                </a>

                                {/* Desktop Menu */}
                                <div className="hidden lg:flex items-center gap-12">
                                    <ul className="flex gap-8 text-sm font-sans font-medium text-lilac/80 tracking-wide">
                                        {['Manifeste', 'Les Portes', 'Partner', 'Journal'].map((item) => (
                                            <li key={item}>
                                                <a href={`#${item.toLowerCase().replace(' ', '')}`} className="hover:text-amber transition-colors">
                                                    {item}
                                                </a>
                                            </li>
                                        ))}
                                    </ul>
                                    <Button variant="primary" className="py-3 px-6 text-xs uppercase tracking-widest">
                                        Candidater
                                    </Button>
                                </div>

                                {/* Mobile Toggle */}
                                <button onClick={() => setMenuState(!menuState)} className="lg:hidden text-cream">
                                    {menuState ? <XIcon /> : <MenuIcon />}
                                </button>
                            </div>
                        </div>

                        {/* Mobile Menu */}
                        {menuState && (
                            <div className="fixed inset-0 bg-black z-40 flex flex-col items-center justify-center space-y-8">
                                {['Manifeste', 'Les Portes', 'Partner'].map((item) => (
                                    <a 
                                        key={item} 
                                        href={`#${item.toLowerCase().replace(' ', '')}`}
                                        onClick={() => setMenuState(false)}
                                        className="font-serif text-4xl text-cream hover:text-amber transition-colors"
                                    >
                                        {item}
                                    </a>
                                ))}
                                <Button variant="primary" onClick={() => setMenuState(false)}>Entrer dans l'Ordre</Button>
                            </div>
                        )}
                    </nav>
                </header>
            );
        };

        // --- HERO : BRUN TERRE (SOCLE) ---
        const Hero = () => {
            return (
                <section className="relative min-h-screen flex items-center justify-center overflow-hidden bg-earth pt-20">
                    <div className="absolute inset-0 bg-black/20 z-10"></div>
                    
                    <div className="relative z-20 text-center max-w-5xl px-6">
                        <Reveal>
                            <div className="inline-flex items-center gap-3 border border-white/20 bg-black/20 px-4 py-2 mb-8 backdrop-blur-md rounded-sm">
                                <span className="w-1.5 h-1.5 bg-amber"></span>
                                <span className="text-xs font-sans uppercase tracking-[0.2em] text-lilac">Message Officiel</span>
                            </div>
                        </Reveal>

                        <Reveal delay={0.2}>
                            <h1 className="text-6xl md:text-8xl lg:text-9xl text-cream font-serif leading-[0.95] mb-8">
                                L'ORDRE <br/>
                                <span className="text-lilac/50">MOODIGITAL</span>
                            </h1>
                        </Reveal>

                        <Reveal delay={0.4}>
                            <p className="text-lg md:text-xl text-lilac/90 max-w-2xl mx-auto font-sans font-light leading-relaxed mb-12">
                                Ni agence. Ni coaching. <br/>
                                Une Maison de stratégie et d’incarnation business pour les entrepreneures souveraines.
                            </p>
                        </Reveal>

                        <Reveal delay={0.6}>
                            <div className="flex flex-col md:flex-row gap-6 justify-center">
                                <Button>Entrer dans l'Ordre</Button>
                                <Button variant="ghost">Lire le manifeste</Button>
                            </div>
                        </Reveal>
                    </div>
                </section>
            );
        };

        // --- MANIFESTE : NOIR (STRUCTURE) ---
        const Manifesto = () => {
            return (
                <section id="manifeste" className="py-32 bg-black relative border-t border-white/5">
                    <div className="max-w-4xl mx-auto px-6 relative z-10">
                        {/* Ligne verticale directrice (Ambre) */}
                        <div className="absolute left-6 md:left-0 top-0 bottom-0 w-px bg-amber/30 hidden md:block"></div>
                        
                        <div className="md:pl-16">
                            <Reveal>
                                <span className="font-manifesto text-amber text-2xl mb-6 block">Évolution</span>
                                <h3 className="text-3xl md:text-5xl font-serif text-cream leading-tight mb-10">
                                    "Moodigital évolue. <br/>
                                    Pas pour devenir plus gros. <br/>
                                    <span className="text-amber">Mais pour devenir plus juste.</span>"
                                </h3>
                            </Reveal>
                            
                            <Reveal delay={0.2}>
                                <div className="space-y-8 text-lilac/80 text-lg font-light md:text-justify max-w-2xl leading-relaxed">
                                    <p>
                                        Ce que je fais aujourd’hui ne peut plus être résumé à "communication".
                                        C’est accompagner des femmes à reprendre leur place, à <strong>incarner</strong> leur business.
                                    </p>
                                    <p>
                                        Alors Moodigital devient un Ordre. Un cadre.
                                        Un espace de discernement. Il n’y a rien à consommer. Seulement des portes.
                                    </p>
                                </div>
                            </Reveal>
                        </div>
                    </div>
                    
                    {/* Damier Ponctuel (Discret) */}
                    <div className="absolute bottom-0 right-0 w-32 h-32 opacity-10"
                         style={{backgroundImage: 'linear-gradient(45deg, #333 25%, transparent 25%), linear-gradient(-45deg, #333 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #333 75%), linear-gradient(-45deg, transparent 75%, #333 75%)', backgroundSize: '20px 20px'}}>
                    </div>
                </section>
            );
        };

        // --- LES PORTES : VERT FORÊT (SAGESSE) ---
        const DoorCard = ({ title, subtitle, description, delay }) => (
            <Reveal delay={delay}>
                {/* Bloc Plein, Angles nets */}
                <div className="group h-full bg-forest border border-white/10 p-10 hover:border-amber/60 transition-colors duration-500 relative overflow-hidden flex flex-col justify-between">
                    <div>
                        <div className="absolute top-4 right-4 text-amber opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                            <Star8 className="w-5 h-5" />
                        </div>
                        
                        <h3 className="text-3xl font-serif text-cream mb-2">{title}</h3>
                        <p className="font-manifesto text-sm text-amber mb-8 tracking-widest">{subtitle}</p>
                        
                        <div className="w-8 h-px bg-metal/50 mb-8 group-hover:w-full group-hover:bg-amber transition-all duration-700"></div>
                        
                        <p className="text-lilac/80 font-light leading-relaxed text-sm mb-8">
                            {description}
                        </p>
                    </div>
                    <div className="flex items-center text-amber text-xs font-bold uppercase tracking-widest opacity-60 group-hover:opacity-100 transition-opacity">
                        Explorer <ArrowRight className="ml-2 w-4 h-4" />
                    </div>
                </div>
            </Reveal>
        );

        const TheDoors = () => {
            return (
                <section id="lesportes" className="py-32 bg-forest relative">
                    <div className="max-w-7xl mx-auto px-6">
                        <SectionHeader 
                            surtitle="L'Écosystème" 
                            title="Trois Portes. Trois Passages." 
                        />
                        <div className="grid md:grid-cols-3 gap-0 border-t border-l border-white/10">
                            {/* Grid collée pour effet "Structure" */}
                            <div className="border-r border-b border-white/10">
                                <DoorCard 
                                    title="ORIGIN"
                                    subtitle="S'ALIGNER & INCARNER"
                                    description="Reprendre le pouvoir. Créer depuis ta vérité. Un espace de guidance stratégique et intuitive pour celles qui sentent qu’un réalignement profond est nécessaire."
                                    delay={0}
                                />
                            </div>
                            <div className="border-r border-b border-white/10">
                                <DoorCard 
                                    title="PARTNER"
                                    subtitle="STRUCTURER & DÉLÉGUER"
                                    description="Ton bras droit stratégique. Pour celles qui veulent structurer et déléguer avec justesse. Pilotage clair, arbitrage, fin du flou."
                                    delay={0.2}
                                />
                            </div>
                            <div className="border-r border-b border-white/10">
                                <DoorCard 
                                    title="TRANSMISSIONS"
                                    subtitle="AUTONOMIE & SAVOIR"
                                    description="Pour avancer en autonomie, à son rythme. Formations, carnets business et programmes courts pour entrer dans l'univers Mood."
                                    delay={0.4}
                                />
                            </div>
                        </div>
                    </div>
                </section>
            );
        };
        
        // --- PARTNER DETAILS : POUR LA COHÉRENCE DU "BRAS DROIT" ---
        const PartnerDetails = () => {
             return (
                <section id="partner" className="py-32 bg-earth text-cream relative overflow-hidden">
                    {/* Background Noise override */}
                    <div className="absolute inset-0 bg-black/10"></div>
                    
                    <div className="max-w-6xl mx-auto px-6 relative z-10">
                        <div className="grid lg:grid-cols-2 gap-16 mb-20">
                            <div>
                                <h2 className="text-4xl md:text-5xl font-serif mb-6">Mood Partner</h2>
                                <p className="text-lg text-lilac/90 font-light max-w-md leading-relaxed">
                                    Ici, on ne vend pas du temps. On vend de la vision, de l'arbitrage et de la structure.
                                    Un pacte sur la durée pour celles qui sont prêtes.
                                </p>
                            </div>
                            <div className="bg-black/20 p-8 border border-white/10 self-end">
                                <h5 className="font-manifesto text-amber mb-4">Règle d'or</h5>
                                <p className="italic text-cream/90 font-serif text-xl">
                                    "La posture précède toujours la stratégie. Ce cadre est là pour te protéger."
                                </p>
                            </div>
                        </div>

                        {/* List style propre */}
                        <div className="border-t border-white/10 space-y-0">
                             {[
                                { title: "ESSENTIAL", target: "Solopreneures lancées", result: "Moins de charge mentale." },
                                { title: "GROWTH", target: "Premières équipes", result: "Croissance maîtrisée." },
                                { title: "EXPANSION", target: "Marques établies", result: "Expansion alignée." }
                             ].map((item, idx) => (
                                <div key={idx} className="grid md:grid-cols-12 gap-6 py-8 border-b border-white/10 hover:bg-white/5 transition-colors px-4">
                                    <div className="md:col-span-4 font-serif text-2xl">{item.title}</div>
                                    <div className="md:col-span-4 text-lilac/80">{item.target}</div>
                                    <div className="md:col-span-4 text-lilac/80">{item.result}</div>
                                </div>
                             ))}
                        </div>

                        <div className="mt-20 text-center">
                            <Button>Candidater pour Partner</Button>
                        </div>
                    </div>
                </section>
             )
        }

        // --- FOOTER : RETOUR À LA TERRE & PHRASE SCEAU ---
        const Footer = () => {
            const currentYear = new Date().getFullYear();
            
            return (
                <footer className="bg-black pt-24 pb-12 border-t border-white/10 relative">
                    <div className="max-w-7xl mx-auto px-6">
                        <div className="grid md:grid-cols-2 gap-12 mb-20 items-start">
                            <div>
                                <div className="flex items-center gap-3 mb-8">
                                    <Star8 className="w-8 h-8 text-amber" />
                                    <span className="font-serif text-3xl text-cream tracking-wide">MOODIGITAL</span>
                                </div>
                                <p className="text-lilac/60 font-light max-w-xs leading-relaxed">
                                    Stratégie & Incarnation.<br/>
                                    Ni bruit, ni fureur. Juste l'essentiel.
                                </p>
                            </div>
                            <div className="md:text-right">
                                <ul className="flex flex-col md:flex-row md:justify-end gap-x-8 gap-y-4 font-manifesto text-amber text-sm tracking-widest uppercase">
                                    <li><a href="#" className="hover:text-cream transition-colors">Instagram</a></li>
                                    <li><a href="#" className="hover:text-cream transition-colors">LinkedIn</a></li>
                                    <li><a href="#" className="hover:text-cream transition-colors">Mentions Légales</a></li>
                                </ul>
                            </div>
                        </div>

                        {/* PHRASE-SCEAU (OBLIGATOIRE) */}
                        <div className="border-t border-white/10 pt-16 text-center">
                            <p className="font-serif text-xl md:text-2xl text-lilac/70 italic tracking-wide">
                                "Dans l’Ordre Moodigital, tout ce qui est transmis est destiné à être incarné."
                            </p>
                            <p className="text-lilac/30 text-[10px] mt-12 font-sans uppercase tracking-[0.2em]">
                                © {currentYear} L'Ordre Moodigital. Tous droits réservés.
                            </p>
                        </div>
                    </div>
                </footer>
            );
        };

        // --- APP ---
        function App() {
            return (
                <div className="bg-black text-cream min-h-screen selection:bg-amber selection:text-black">
                    <Navigation />
                    <Hero />
                    <Manifesto />
                    <TheDoors />
                    <PartnerDetails />
                    <Footer />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
